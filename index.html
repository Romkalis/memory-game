<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Игра на память">
    <title>RS Memory Game</title>
  </head>
  <body id="app">
    
    <header class="header">
      <nav class="container">
        <img src="/src/assets/logo.svg" alt="logo" class="header__logo" width="50" height="50">
        <ul class="header__list">
          <li class="header__item"><button class="header__link">Start Now</button></li>
          <li class="header__item"><button class="header__link">Scores</button></li>
        </ul>
      </nav>
    </header>

    <main class="game container">
      <ul class="game__grid"></ul>
    </main>

    <footer class="footer">
      <div class="container">
        <blockquote>
          2026 Mind Game
        </blockquote>
      </div>
    </footer>
    

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
